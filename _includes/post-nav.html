<nav class="post-nav" aria-label="More posts">
  {%- if page.previous.url %}
  <a class="post-nav-card" href="{{ page.previous.url | relative_url }}" rel="prev">
    <span class="post-nav-label">&larr; Previous</span>
    <span class="post-nav-title">{{ page.previous.title | escape }}</span>
  </a>
  {%- else %}
  <span></span>
  {%- endif %}
  {%- if page.next.url %}
  <a class="post-nav-card next" href="{{ page.next.url | relative_url }}" rel="next">
    <span class="post-nav-label">Next &rarr;</span>
    <span class="post-nav-title">{{ page.next.title | escape }}</span>
  </a>
  {%- endif %}
</nav>
