{%- assign share_url = page.url | absolute_url -%}
{%- assign safeurl = share_url | url_encode -%}
{%- assign safetitle = page.title | url_encode -%}
<div class="share">
  <span class="share-label">Share</span>
  <a class="icon-button" href="https://x.com/intent/post?url={{ safeurl }}&amp;text={{ safetitle }}&amp;via={{ site.twitter_username }}" target="_blank" rel="noopener" aria-label="Share on X (Twitter)" title="Share on X (Twitter)">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
  </a>
  <a class="icon-button" href="https://www.linkedin.com/sharing/share-offsite/?url={{ safeurl }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn" title="Share on LinkedIn">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
  </a>
  <a class="icon-button" href="mailto:?subject={{ safetitle }}&amp;body={{ safeurl }}" aria-label="Share by email" title="Share by email">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
  </a>
  <button class="icon-button copy-link" type="button" data-url="{{ share_url }}" aria-label="Copy link" title="Copy link">
    <svg class="swap-icon icon-copy" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <svg class="swap-icon icon-check" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </button>
  <span class="copy-status" role="status" aria-live="polite"></span>
</div>
